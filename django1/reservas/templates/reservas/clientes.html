{% extends 'reservas/base.html' %}
{% block content %}
<h1>Clientes</h1>
<a class="btn" href="{% url 'clientes_create' %}">Nuevo cliente</a>
<table>
    <thead><tr><th>Nombre</th><th>Teléfono</th><th>Reservas</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for c in clientes %}
        <tr><td>{{ c.nombre }}</td><td>{{ c.telefono }}</td><td>{{ c.reservas.count }}</td>
            <td><a href="{% url 'clientes_update' c.pk %}">Editar</a>
                <a class="danger" href="{% url 'clientes_delete' c.pk %}">Eliminar</a></td></tr>
    {% empty %}<tr><td colspan="4">No hay clientes.</td></tr>{% endfor %}
    </tbody>
</table>
{% endblock %}
