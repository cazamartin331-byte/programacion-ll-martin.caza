{% extends 'reservas/base.html' %}
{% block content %}
<h1>Mesas</h1>
<a class="btn" href="{% url 'mesas_create' %}">Nueva mesa</a>
<table>
    <thead><tr><th>Número</th><th>Capacidad</th><th>Ubicación</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for m in mesas %}
        <tr><td>{{ m.numero }}</td><td>{{ m.capacidad }}</td><td>{{ m.ubicacion }}</td>
            <td><a href="{% url 'mesas_update' m.pk %}">Editar</a>
                <a class="danger" href="{% url 'mesas_delete' m.pk %}">Eliminar</a></td></tr>
    {% empty %}<tr><td colspan="4">No hay mesas.</td></tr>{% endfor %}
    </tbody>
</table>
{% endblock %}
