{% extends 'menu/base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Crear{% endif %} ingrediente{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Crear{% endif %} ingrediente</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn" href="{% url 'ingrediente_list' %}">Cancelar</a>
</form>
{% endblock %}
